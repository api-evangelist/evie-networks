method: searched
source: |
  Evie Networks public web surface (evie.com.au, 58-page sitemap read in full),
  api.goevie.com.au probes, and the CDR Register energy data-holder brand
  summary. No OpenAPI or other machine-readable contract exists to derive from.
summary: |
  Evie Networks names no EV-charging interoperability standard, no energy data
  standard and no API convention anywhere on its public surface. Every entry
  below is a recorded negative with the evidence that produced it. Nothing here
  is inferred from a spec, because there is no spec.
standards:
- id: ocpp
  name: Open Charge Point Protocol
  conforms: false
  evidence: |
    Not named on any page of evie.com.au (full sitemap read 2026-07-27). Evie
    operates its own chargers so it almost certainly speaks OCPP to them, but it
    publishes no claim, version or certification, so nothing is asserted here.
- id: ocpi
  name: Open Charge Point Interface (roaming)
  conforms: false
  evidence: |
    https://evie.com.au/ocpi, /ocpi/versions and api.goevie.com.au/ocpi,
    /ocpi/versions, /ocpi/cpo/versions all returned 404 (2026-07-27). No roaming
    surface, no published roaming agreement.
- id: iso-15118
  name: ISO 15118 Plug and Charge
  conforms: false
  evidence: |
    The Autocharge page (https://evie.com.au/autocharge/, 200) identifies
    vehicles by a one-way-hashed MAC address, which is the OCPP-era Autocharge
    convention rather than ISO 15118 Plug and Charge. Neither standard is named.
- id: cdr-energy
  name: Consumer Data Right (energy) — Consumer Data Standards
  conforms: false
  evidence: |
    Authoritative negative: the CDR Register energy data-holder brand summary
    (https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary,
    HTTP 200, x-v:1) returned 84 designated brands; a case-insensitive search
    for "evie" matched none. The CDR energy designation binds electricity
    retailers and AEMO, not charge point operators.
