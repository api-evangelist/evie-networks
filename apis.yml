name: Evie Networks
kind: company
description: >-
  Evie Networks is an Australian electric-vehicle charging infrastructure
  company, founded in 2017 and backed by the St Baker Energy Innovation Fund, that
  owns and operates one of the country's largest DC fast and ultrafast public charging
  networks across 300+ locations in every state and territory. It sits downstream of
  the electricity retail market as a charge point operator (CPO) and e-mobility
  service provider, buying energy and reselling it as charging sessions to drivers
  and fleets, and it also builds and operates charging assets for site hosts,
  councils, dealerships and commercial property owners. Its API posture is closed:
  as of 2026-07-27 there is no developer portal, no published API documentation, no
  OpenAPI or other machine-readable contract, and no named support for the EV
  charging interoperability standards (OCPP, OCPI, ISO 15118). Evie is not a
  designated data holder under Australia's Consumer Data Right energy regime — the
  CDR Register's public energy data-holder brand summary lists 84 brands and Evie is
  not among them — so the statutory data mandate that produced identical APIs across
  Australian banks and energy retailers does not reach the EV charging layer at all.
  A live production API host exists at api.goevie.com.au serving the Evie Charging
  mobile app, but it is undocumented, unadvertised and returns a Google Cloud
  Endpoints 404 to anonymous callers. Neither consumer charging-session data nor
  network/market data is published through any documented public interface; charger
  location data reaches developers only through third-party aggregators.
