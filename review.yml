aid: evie-networks
name: Evie Networks
review:
  question: Does Evie Networks expose a documented public API, and does any energy
    data mandate reach it?
  answer: false
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: ev-charging
  primaryDomain: evienetworks.com
  effectiveDomain: evie.com.au
  domainNote: |
    evienetworks.com resolves and 301/302 redirects to https://evie.com.au/
    (curl -L, final url_effective https://evie.com.au/, HTTP 200, 2026-07-27).
    All substantive probing was therefore done against evie.com.au.
  wafNote: |
    evie.com.au sits behind Wordfence on WP Engine. Requests sent with a
    browser-like User-Agent ("Mozilla/5.0") are answered 403; the same URLs
    return 200 to default curl. Every status recorded below was captured with
    default curl unless stated otherwise.

mandate:
  regime: none
  status: not-applicable
  regimeConsidered: cdr-energy
  homeMarketRegime: |
    Australia's Consumer Data Right was extended to energy and is live. Under the
    energy designation the obligation falls on electricity RETAILERS as primary
    data holders and on AEMO as a secondary data holder, under the ACCC as
    regulator and the Data Standards Body's Consumer Data Standards (energy).
    That is the same statutory machinery that produced the byte-for-byte
    identical banking APIs.
  whyNotApplicable: |
    Evie Networks is a charge point operator and e-mobility service provider, not
    a licensed electricity retailer and not AEMO. The CDR energy designation does
    not reach the EV charging layer. A mandate proven in banking and transplanted
    into energy stops at the retailer boundary; downstream energy-consuming
    infrastructure businesses like public charging networks are outside it
    entirely. This is a control case for the study: the regime is live and
    working in the same country, and it still produces zero API obligation here.
  verification:
    - method: CDR Register public API query
      url: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
      headers: 'x-v: 1'
      httpStatus: 200
      fetched: '2026-07-27'
      result: |
        Returned 84 designated energy data-holder brands (Arcline by RACV,
        Origin Energy, AGL, EnergyAustralia, ENGIE, Alinta Energy, Powershop,
        Red Energy, Amber, Energy Locals, Ergon Energy Retail, Ampol Energy,
        etc.), each with a publicBaseUri pointing at a conformant CDR energy
        surface (e.g. https://public.cdr.energy.arcline.com.au). Case-insensitive
        search for "evie" across brandName returned ZERO matches. Evie Networks
        is not a designated CDR energy data holder.
    - method: CDR Register path variants probed
      urls:
        - url: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands
          httpStatus: 404
          note: Not a valid unauthenticated Register endpoint (mTLS path).
        - url: https://api.cdr.gov.au/cdr-register/v1/all/data-holders/brands/summary
          httpStatus: 200
          note: Cross-industry summary, also contains no Evie brand.
  claimsVsImplementation: |
    Evie makes NO public compliance claim about CDR, Green Button, or any other
    data-sharing regime. There is nothing to downgrade from "claimed" to
    "unverified" — the record is simply empty. Recording it as `none` /
    `not-applicable` rather than `designated-not-live` matters: Evie is not
    late on an obligation, it was never covered by one.

dataStandard:
  standard: no standard reference found
  probedFor:
    - Green Button / ESPI
    - CDR Consumer Data Standards (energy)
    - OCPP (Open Charge Point Protocol)
    - OCPI (Open Charge Point Interface)
    - ISO 15118 / Plug and Charge
    - OpenADR
    - IEEE 2030.5
    - IEC CIM 61968/61970
  findings: |
    No page on evie.com.au names OCPP, OCPI, ISO 15118, Green Button, OpenADR,
    IEEE 2030.5 or CIM. The about, partners, fleet-solutions and autocharge
    pages were read in full. The closest technical disclosure is the Autocharge
    page, which describes driver identification by "the unique MAC address of
    your vehicle", de-identified with "a one-way hash ... so your car's full MAC
    address is not sent to or stored by Evie". MAC-address Autocharge is the
    OCPP-era convention rather than ISO 15118 Plug and Charge, but Evie names
    neither standard, so no standard is recorded as implemented.
  roaming: |
    No OCPI roaming surface found. https://evie.com.au/ocpi, /ocpi/versions and
    api.goevie.com.au/ocpi, /ocpi/versions, /ocpi/cpo/versions all returned 404.
    No published roaming agreement was found; industry commentary through 2025
    positions Evie as one of the Australian networks that had NOT roamed onto
    the Chargefox platform.

dataSplit:
  consumerDataApi: false
  consumerDataNotes: |
    A driver's charging-session, billing and subscription data exists only inside
    the Evie Charging mobile app and the customer's own account. There is no
    documented API, no consent flow for third parties, no accreditation pathway,
    and no data-portability mechanism of any kind. A third party cannot obtain an
    individual customer's usage data through any documented interface.
  marketDataOpen: false
  marketDataNotes: |
    Evie publishes no open network, utilisation, site-availability, pricing or
    emissions data feed. Charger locations are rendered on
    https://evie.com.au/find-a-charger/ by the WP Store Locator WordPress plugin
    (Google Maps JS + WordPress AJAX), not by any Evie data API. Evie charger
    data reaches developers only indirectly, via third-party aggregators
    (PlugShare, Open Charge Map and state EV-charger datasets) that Evie does not
    operate and that were not treated as an Evie API surface here.
  theSplit: |
    Unlike a grid operator or market body, Evie is closed on BOTH axes. There is
    no open market-data side to offset the closed consumer side. That is the
    finding: at the EV charging layer of the Australian energy value chain,
    neither the statutory consumer-data mandate nor the open-market-data norm
    applies, and the company publishes nothing.

access:
  gate: none-published
  gated: true
  whatADeveloperMustDo: |
    There is nothing a developer can do. No developer portal, no signup, no
    application form, no partner API programme, no data licence, no sandbox and
    no published contact route for API access exist. Commercial routes on the
    site (become a site host, fleet charge cards, council solutions, dealership
    programmes) are sales enquiry forms for charging services, not for data or
    API access. The only self-service assets are the consumer mobile apps.
  authModel: |
    Not published. No API-key programme, no OAuth2 or OpenID Connect discovery
    document, no mTLS onboarding, no CDR accreditation pathway.
    https://evie.com.au/.well-known/openid-configuration -> 404 and
    https://api.goevie.com.au/.well-known/openid-configuration -> 404
    (both fetched anonymously, 2026-07-27). The mobile app authenticates end
    users to their own account; that scheme is undocumented.

