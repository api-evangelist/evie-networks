      httpStatus: 404
    - url: https://evie.com.au/robots.txt
      httpStatus: 200
      note: Yoast/WooCommerce block; sitemap at /sitemap_index.xml.
    - url: https://evie.com.au/sitemap.xml
      httpStatus: 200
      note: |
        Full page-sitemap enumerated (58 pages). No developer, API, docs, data,
        roaming or open-data page exists anywhere in the sitemap.
  liveApiHostFound:
    host: https://api.goevie.com.au
    httpStatus: 404
    fetched: '2026-07-27'
    responseBody: '{"message":"The current request is not defined by this API.","code":404}'
    responseHeaders: 'server: Google Frontend; x-envoy-decorator-operation: ingress
      UnknownOperationName; via: 1.1 google'
    interpretation: |
      A REAL production API gateway exists — the response is the Google Cloud
      Endpoints / ESPv2 "request not defined by this API" body, meaning a
      declared API surface is running behind it. It backs the Evie Charging
      mobile app. It is entirely undocumented and unadvertised: nothing on
      evie.com.au references it. It is deliberately NOT listed in apis.yml
      because no public documentation, contract, terms or onboarding exist for
      it — listing it would present a private app backend as a public API.
    pathsProbedOnHost:
      - path: /openapi.json
        httpStatus: 404
      - path: /swagger.json
        httpStatus: 404
      - path: /v1
        httpStatus: 404
      - path: /docs
        httpStatus: 404
      - path: /api-docs
        httpStatus: 404
      - path: /.well-known/openid-configuration
        httpStatus: 404
      - path: /ocpi
        httpStatus: 404
      - path: /ocpi/versions
        httpStatus: 404
      - path: /ocpi/cpo/versions
        httpStatus: 404
      - path: /healthz
        httpStatus: 404
      - path: /health
        httpStatus: 404
  incidentalJsonSurface:
    url: https://evie.com.au/wp-json/
    httpStatus: 200
    fetched: '2026-07-27'
    what: |
      The marketing site is WordPress (WP Engine) and its core REST API is open
      anonymously: 813 routes across 31 namespaces including wp/v2, wc/v3,
      wc/store, wpsl/v1, elasticpress/v1, yoast/v1 and jetpack/v4. A GET of
      https://evie.com.au/wp-json/wp/v2/wpsl_stores?per_page=2 returned HTTP 200
      with JSON records for charging sites (first record title "594 Anzac Parade
      Parking - Kingsford"), because the charger map is built on the WP Store
      Locator plugin.
    decision: |
      NOT listed as an Evie API. This is WordPress and WooCommerce CMS
      plumbing exposed by default on a marketing site, documented by WordPress
      rather than by Evie, with no product intent, no terms of use and no
      stability commitment. Recording it as an "Evie charging locations API"
      would be a fabrication of intent. It is documented here only because it is
      the one anonymously callable JSON surface the company operates, and
      because it is the accidental route by which Evie site data is currently
      machine-readable at all.
  codeAndArtifacts:
    - url: https://github.com/goevie
      httpStatus: 200
      note: |
        Evie's GitHub organisation ("Evie", created 2019-06-28) has 1 public
        repository, "coding_challenge" (a recruiting exercise). No SDKs, no
        OpenAPI, no client libraries, no spec artifacts.
    - url: https://api.github.com/orgs/evienetworks
      httpStatus: 404
    - url: https://api.github.com/orgs/evie-networks
      httpStatus: 404
    - url: https://status.evie.com.au
      httpStatus: 000
      note: No status page.

apiFamily:
  documentedPublicApis: 0
  note: |
    Evie's product surface maps to charging sessions, tariffs/subscription
    pricing, site/charger availability, fleet account billing and reconciliation,
    and Autocharge vehicle identification. Every one of those is delivered
    through the consumer app, the fleet charge-card programme or an account
    manager. None of them is exposed as a documented API, so apis[] in apis.yml
    is deliberately empty.

sources:
  - url: https://evie.com.au/about-evie/
    type: About
    httpStatus: 200
    note: |
      Founded 2017; backed by Trevor St Baker's St Baker Energy Innovation Fund;
      offices in Sydney (Eveleigh), Brisbane (410 Queen St) and Melbourne (333
      Collins St); "hundreds of charging stations" across "14 cities and regions
      in every state and territory of Australia". No mention of APIs, OCPP, OCPI
      or roaming.
  - url: https://evie.com.au/autocharge/
    type: Documentation
    httpStatus: 200
    note: |
      Autocharge identifies the vehicle by MAC address, hashed one-way. No
      standard named.
  - url: https://evie.com.au/charging-solutions/fleet/
    type: Documentation
    httpStatus: 200
    note: |
      Fleet offer promises "actionable insights with reporting" and "the data you
      need to understand charging patterns, preferred locations, and costs" but
      names no portal, no export format and no API.
  - url: https://evie.com.au/our-partners/
    type: Documentation
    httpStatus: 200
    note: |
      Partners listed are commercial/site hosts (Coles, Active Super, Haben,
      Consolidated Properties Group, Geely, ActewAGL). Mentions consolidating
      "charge session data across all charging categories" and "site-specific
      insights and usage data" for councils — delivered as a service, not an API.
  - url: https://evie.com.au/find-a-charger/
    type: Documentation
    httpStatus: 200
    note: |
      Charger map is WP Store Locator over the Google Maps JavaScript API. No
      Evie-operated location data API is referenced.
  - url: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
    type: APIReference
    httpStatus: 200
    note: |
      Authoritative negative evidence: 84 designated CDR energy data-holder
      brands, Evie not among them.

conclusion: |
  Evie Networks is a built-stub: real, verifiable company identity with zero
  documented public API surface. The exercise's central question resolves
  cleanly here. Australia proved a statutory data mandate is replicable — the
  CDR Register answers anonymously with 84 energy data holders each publishing a
  conformant base URI, which is exactly the banking pattern transplanted. But
  the mandate's edge is sharp: it binds retailers and AEMO, and it stops there.
  Evie, an infrastructure business that sells electricity to drivers at 300+
  sites, sits outside it and publishes nothing — no consumer data API, no open
  market data, no standard, no portal, no auth model. It runs a real API
  (api.goevie.com.au, live Google Cloud Endpoints gateway) purely as private
  plumbing for its own app. A mandate is not an implementation, and here a
  working mandate a single layer up produces no implementation at all.
